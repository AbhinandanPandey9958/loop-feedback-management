<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Delete Feedback</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f4f6f8;
        }

        .header {
            background: #1f4e78;
            color: white;
            padding: 20px 40px;
        }

        .header h1 {
            margin: 0;
        }

        .container {
            max-width: 600px;
            margin: 80px auto;
            padding: 0 20px;
        }

        .delete-box {
            background: white;
            padding: 35px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
            text-align: center;
        }

        .delete-box h2 {
            color: #d9534f;
            margin-top: 0;
        }

        .feedback {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 6px;
            margin: 20px 0;
            text-align: left;
        }

        .delete-btn {
            background: #d9534f;
            color: white;
            border: none;
            padding: 11px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 15px;
            font-weight: bold;
        }

        .delete-btn:hover {
            background: #b52b27;
        }

        .cancel-btn {
            display: inline-block;
            margin-left: 10px;
            padding: 11px 20px;
            background: #6c757d;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            font-size: 15px;
        }

        .cancel-btn:hover {
            background: #545b62;
        }
    </style>

</head>

<body>

    <div class="header">
        <h1>Delete Feedback</h1>
    </div>

    <div class="container">

        <div class="delete-box">

            <h2>⚠ Delete Feedback?</h2>

            <p>
                Are you sure you want to delete this feedback?
            </p>

            <div class="feedback">
                <strong>Feedback:</strong>
                <p>{{ feedback.content }}</p>
            </div>

            <form method="POST">

                {% csrf_token %}

                <button type="submit" class="delete-btn">
                    Yes, Delete
                </button>

                <a href="/" class="cancel-btn">
                    Cancel
                </a>

            </form>

        </div>

    </div>

</body>

</html>
