<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add Feedback</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f4f6f8;
        }

        .header {
            background: #1f4e78;
            color: white;
            padding: 20px 40px;
        }

        .header h1 {
            margin: 0;
        }

        .container {
            max-width: 800px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .form-box {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #333;
        }

        textarea,
        select,
        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
            font-size: 14px;
        }

        textarea {
            height: 120px;
            resize: vertical;
        }

        .btn {
            background: #1f4e78;
            color: white;
            border: none;
            padding: 11px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 15px;
            font-weight: bold;
        }

        .btn:hover {
            background: #163a5c;
        }

        .back-btn {
            display: inline-block;
            margin-top: 15px;
            color: #1f4e78;
            text-decoration: none;
        }

        .back-btn:hover {
            text-decoration: underline;
        }
    </style>

</head>

<body>

    <div class="header">
        <h1>Add Feedback</h1>
    </div>

    <div class="container">

        <div class="form-box">

            <form method="POST">

                {% csrf_token %}


                {% if error %}
                    <div style="
                        background: #f8d7da;
                        color: #842029;
                        padding: 10px;
                        border-radius: 6px;
                        margin-bottom: 20px;
                    ">
                        {{ error }}
                    </div>
                    
                {% endif %}

                <div class="form-group">

                    <label>Feedback Content:</label>

                    <textarea
                        name="content"
                        placeholder="Enter customer feedback..."
                        required
                    ></textarea>

                </div>


                <div class="form-group">

                    <label>Channel:</label>

                    <select name="channel" required>

                        <option value="Website">
                            Website
                        </option>

                        <option value="Email">
                            Email
                        </option>

                        <option value="Social Media">
                            Social Media
                        </option>

                    </select>

                </div>


                <div class="form-group">

                    <label>Sentiment:</label>

                    <select name="sentiment" required>

                        <option value="POS">
                            Positive
                        </option>

                        <option value="NEU">
                            Neutral
                        </option>

                        <option value="NEG">
                            Negative
                        </option>

                    </select>

                </div>


                <div class="form-group">

                    <label>Status:</label>

                    <select name="status" required>

                        <option value="NEW">
                            New
                        </option>

                        <option value="REVIEWED">
                            Reviewed
                        </option>

                        <option value="ACTIONED">
                            Actioned
                        </option>

                    </select>

                </div>


                <button type="submit" class="btn">
                    Add Feedback
                </button>

            </form>


            <a href="/" class="back-btn">
                ← Back to Dashboard
            </a>

        </div>

    </div>

</body>

</html>
