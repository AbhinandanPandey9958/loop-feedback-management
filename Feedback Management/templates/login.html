<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - Feedback Management</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;

            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-box {
            width: 400px;
            background: white;
            padding: 35px;

            border-radius: 12px;

            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.10);
        }

        .login-box h1 {
            text-align: center;
            color: #1f4e78;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #333;
        }

        input {
            width: 100%;
            padding: 12px;

            border: 1px solid #ccc;
            border-radius: 6px;

            font-size: 14px;
        }

        input:focus {
            outline: none;
            border-color: #1f4e78;
        }

        .login-btn {
            width: 100%;

            padding: 12px;

            background: #1f4e78;
            color: white;

            border: none;
            border-radius: 6px;

            font-size: 15px;
            font-weight: bold;

            cursor: pointer;
        }

        .login-btn:hover {
            background: #163a5c;
        }

        .error {
            background: #f8d7da;
            color: #842029;

            padding: 10px;

            border-radius: 6px;

            margin-bottom: 20px;

            font-size: 14px;
        }

    </style>

</head>


<body>

    <div class="login-box">

        <h1>Feedback Management</h1>

        <p class="subtitle">
            Login to access your dashboard
        </p>


        {% if form.errors %}

            <div class="error">
                Invalid username or password.
            </div>

        {% endif %}


        <form method="POST">

            {% csrf_token %}


            <div class="form-group">

                <label for="username">
                    Username
                </label>

                <input
                    type="text"
                    name="username"
                    id="username"
                    placeholder="Enter username"
                    required
                >

            </div>


            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    name="password"
                    id="password"
                    placeholder="Enter password"
                    required
                >

            </div>


            <button
                type="submit"
                class="login-btn"
            >
                Login
            </button>

        </form>

    </div>

</body>

</html>
